name: auto-merge

# Every pull request goes into the merge queue on its own once `ci-gate` is
# green: this turns on auto-merge, and the queue does the rest (ci.yml runs
# everything on the merged result, then master moves).
#
# Not for drafts, and not for forks: a fork's run gets no secrets, and nothing
# from outside merges without a person. A push after the queue threw a pull
# request out (`synchronize`) turns it back on.
#
# Only for pull requests into master: a stacked one (its base is another pull
# request's branch) has no merge queue, and `gh pr merge --auto` there fails
# asking for a merge method. It joins when it is retargeted to master
# (`edited` with a base change).
#
# It acts as the Xiangyu-Labs merge App (secrets AUTOMERGE_APP_ID and
# AUTOMERGE_APP_PRIVATE_KEY), not as GITHUB_TOKEN: auto-merge turned on with
# GITHUB_TOKEN is accepted and then never enqueues, because GitHub starts
# nothing from what that token does.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions: {}

jobs:
  enqueue:
    name: enqueue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    steps:
      - name: Act as the merge App
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Turn on auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --auto --repo "$GITHUB_REPOSITORY"
