# The `edge` server block: a proxy to the Next standalone server, the shared
# uploads volume, and the WeChat domain-verification files.
#
# Four surfaces behind one port:
#   /                the landing page, answered by `web` (apps/web/app/page.tsx)
#   /admin, /admin-api, /api, /scan-upload    the `web` container
#   /mcp, /oauth, /.well-known/oauth-*        the same, for AI assistants
#   /uploads/        the shared volume, as inert bytes
#   /<name>.txt      a read-only directory of verification files (deploy/README.md)
#
# plus `/favicon.ico`, `/icon.svg` and `/robots.txt`, exactly, from `web`.
#
# Anything else is redirected to `/`: there is no storefront on the web any
# more, the shop is the WeChat mini-program.

# `resolve`: the address of `web` is looked up again every two seconds through
# Docker's DNS, not once at start. A release that stops nothing recreates `web`
# beside a running edge, and the new container comes up on a new address; an
# edge that had resolved the name once would keep proxying to the old one.
upstream web {
    zone web 64k;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server web:3000 resolve;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# An upload opens in the browser only if it is an image or a
# video — what the storefront and admin embed. Anything else (a PDF, an office
# file, audio, bytes nginx cannot type) is a download, so following a link to
# it never renders a document on the shop's own origin. `<img>`, `<video>` and
# `<audio>` ignore the header, so embedding is unaffected. Keyed on the type
# nginx derives from the extension, which is the one it sends. SVG is denied
# outright below; it is listed here as well so that relaxing that deny does not
# make it inline.
map $sent_http_content_type $uploads_disposition {
    default           attachment;
    ~*^image/svg      attachment;
    ~*^image/         inline;
    ~*^video/         inline;
}

# HSTS, only on a request that reached the front proxy over https: browsers
# ignore the header over plain http anyway, and the drill and a first install
# talk to the edge over http. No `includeSubDomains` and no `preload`: other
# hosts under the same domain are not ours to pin. A year, the usual value.
map $http_x_forwarded_proto $edge_hsts {
    default "";
    https   "max-age=31536000";
}

# Upload bytes are cached for a week, but only an answer that *is* the bytes.
# With `always` on a fixed value a 404 was cached for seven days as well, so a
# picture uploaded under a name somebody had already asked for stayed missing
# for a week in every cache between. Errors are not cached at all.
map $status $uploads_cache_control {
    default "no-store";
    200     "public, max-age=604800";
    206     "public, max-age=604800";
    304     "public, max-age=604800";
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    # Matches the application's own upload ceiling. Nginx answers 413 before a
    # byte reaches the app, so the two limits have to agree or the larger one
    # is a lie. Keep in step with `NEXT_MAX_UPLOAD_SIZE` in compose.yml.
    client_max_body_size 100M;

    server_tokens off;

    # --- the client address -------------------------------------------------
    #
    # The trust boundary for "who is calling". `X-Forwarded-For` is honoured
    # only from the front proxy's own network — the list
    # `40-edge-real-ip.sh` writes from NEXT_EDGE_TRUSTED_PROXIES at start —
    # and, with `real_ip_recursive`, the address used is the right-most one
    # that is not a trusted proxy: the peer the front proxy itself saw. A
    # client's own `X-Forwarded-For: 198.51.100.7` is only ever to the left of
    # that, so it is never picked. From any other peer the header is ignored
    # and `$remote_addr` stays the TCP peer.
    #
    # Upstream, the edge then *overwrites* both headers with that one address
    # (see the proxy locations): the app reads `X-Real-IP` and nothing else
    # (`apps/web/src/server/request-meta.ts`).
    include /etc/nginx/edge/real-ip.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # The uploads location re-states these; `add_header` does not inherit into
    # a block that sets one of its own.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Empty over http, so nginx sends no header at all there.
    add_header Strict-Transport-Security $edge_hsts always;

    # --- probes -------------------------------------------------------------

    # Liveness of the edge itself. Deliberately answered by nginx: it must not
    # depend on the app, or a slow app would take the edge's own probe down
    # with it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Readiness of what is behind the edge: the deep check — database, Redis,
    # the schema and the worker heartbeat — answered by the app itself and 503
    # when any of them is down (`apps/web/src/server/health.ts`).
    #
    # Nothing restarts a container on this answer. The container healthchecks
    # call `/api/v1/health`, which touches nothing; `deploy/lib/readiness.sh`
    # reads this endpoint as the gate on a *release* and keeps its own direct
    # queries as a second opinion.
    location = /readyz {
        proxy_pass http://web/api/v1/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # --- the application ----------------------------------------------------

    # Server-sent events. Buffering an SSE stream holds every event until the
    # buffer fills, which looks exactly like "notifications stopped working";
    # the long read timeout keeps nginx from cutting an idle stream.
    location = /admin-api/notifications/stream {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended: `$remote_addr` is the
        # realip result above, and the client's own header goes no further.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Every Next route needs its prefix here, or a location of its own: a
    # path nothing above matches is redirected to the landing page at `/`,
    # not a 404.
    # `/scan-upload/<token>` is the page the admin's 扫码上传 QR code opens on
    # a phone. `deploy/rehearsal/drill.sh::edge/proxies-every-page-route`
    # requests every page route through this server and fails on one it does
    # not proxy.
    # `/oauth/*` is the sign-in an MCP client (Claude, ChatGPT…) walks the
    # admin through; `/mcp` itself has its own location below.
    # `/downloads/shop.js` is the `shop` CLI, built into the web image.
    location ~ ^/(admin|admin-api|api|scan-upload|oauth|downloads)(/|$) {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended: `$remote_addr` is the
        # realip result above, and the client's own header goes no further.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # The AI-assistant endpoint (`apps/web/app/mcp/route.ts`). Each POST is
    # answered as a short SSE stream: unbuffered, or a slow operation looks
    # like a hung assistant until it finishes.
    location = /mcp {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    # OAuth discovery for MCP clients (RFC 9728 / RFC 8414), rewritten by
    # `next.config.ts` to `/oauth/metadata/*`. `^~` so the dot-file deny below
    # does not take it; only these two names, nothing else under `.well-known`.
    location ^~ /.well-known/oauth- {
        location ~ ^/\.well-known/oauth-(protected-resource|authorization-server)(/|$) {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
        return 404;
    }

    # Next's own build assets are immutable and content-hashed.
    location /_next/static/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $edge_hsts always;
        access_log off;
    }

    # --- uploads ------------------------------------------------------------

    # Static bytes, never code. `^~` wins over every regex location below, so
    # the dotfile deny and the nosniff header are restated here rather than
    # inherited: a nested `^~` location silently drops them otherwise.
    #
    # The uploader sniffs content and refuses scripts, HTML and SVG
    # (STOR-001), so this is defence in depth rather than the only guard. It
    # stays because depth is the point.
    #
    # These bytes share the shop's origin — a deliberate, written-down choice
    # (`deploy/README.md` § "Where uploads are served
    # from"); the three headers below are what makes that tolerable.
    location ^~ /uploads/ {
        alias /data/uploads/;

        location ~ /\. { deny all; access_log off; log_not_found off; }
        location ~* \.(ph(p[3457]?|t|tml|ar)|jsp?|aspx?|cgi|pl|py|sh|so|exe|html?|xhtml|svgz?)$ { deny all; }

        # Known media types keep their real type; everything else is bytes, not
        # a guess. The `^~` prefix means nothing here is inherited, so the
        # header set is written out in full rather than assumed. Cache-Control
        # follows the status (`$uploads_cache_control`): a 404 or a 403 is
        # never cached.
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        # An image served as `text/html` because a browser guessed is a stored
        # XSS on our own origin.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Content-Disposition $uploads_disposition always;
        add_header Cache-Control $uploads_cache_control always;
        add_header Strict-Transport-Security $edge_hsts always;

        try_files $uri =404;
        access_log off;
    }

    # --- the landing page ---------------------------------------------------

    # `/` is the web app's landing page: the shop's name and the 小程序码.
    # An exact match, so the prefix locations above are unaffected. No
    # `add_header` here, so the server-level three are inherited; the cache
    # headers are Next's (the page is `force-dynamic`). The page needs no other
    # static file but its icons (next section): its styles are inline, Next's
    # runtime is under the proxied `/_next/static/`, and the code image is
    # under `/uploads/`.
    location = / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # --- icons and robots.txt -----------------------------------------------

    # Files Next answers from `apps/web/app` by convention: `favicon.ico`,
    # `icon.svg` (every page, the admin's included, links it as its icon) and
    # `robots.ts` (`Disallow: /`). Exact matches, so each wins over every
    # regex below whatever the order: `/robots.txt` would otherwise fall under
    # the verification-file rule and come from that directory, and the icons
    # would be redirected to `/`. A new file-convention icon in `apps/web/app`
    # (an `apple-icon.png`, say) needs a location here too.
    location = /favicon.ico {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /icon.svg {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /robots.txt {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # --- domain verification ------------------------------------------------

    # WeChat's 业务域名 check fetches `/<name>.txt` from the domain's root
    # (docs/mini/wechat-compliance.md C12). The files come from a read-only
    # mount the operator fills by hand (deploy/README.md, "Domain verification
    # files"), never from the app. Root level only, and a plain name: no
    # slash, no dot but the extension, so nothing here reaches past the
    # directory. A name that is not there is a 404, not the redirect below —
    # a verifier should see "missing", not a page. `/robots.txt` is the one
    # name never served from here: the exact location above takes it.
    location ~ ^/[A-Za-z0-9_-]+\.txt$ {
        root /srv/domain-verification;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security $edge_hsts always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Anything else — an old H5 link, an old share link — goes to the landing
    # page. Last, so every rule above wins over it. `absolute_redirect off`
    # sends `Location: /` as is: nginx would otherwise spell it out as
    # `http://<host>/`, and a shopper on https would take a detour through
    # Traefik's http-to-https redirect.
    location / {
        absolute_redirect off;
        return 302 /;
    }
}
